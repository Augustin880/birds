<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bird Atlas Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles-dark.css" />
  </head>
  <body class="browse-page">
    <section class="app-screen browser-shell">
      <header class="topbar">
        <div class="topbar__meta">
          <p class="eyebrow">Bird Atlas</p>
          <h1 class="topbar__title">Browse Taxonomy</h1>
          <p class="eyebrow">Current path</p>
          <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
        </div>
        <div class="topbar__actions">
          <a class="ghost-button" id="open-editor-link" href="./edit.html">
            Edit Taxonomy
          </a>
          <button class="ghost-button" id="export-button" type="button">
            Export JSON
          </button>
        </div>
      </header>
      <p class="eyebrow topbar-status" id="file-status"></p>

      <main class="browse-layout">
        <section class="content-panel browse-panel">
          <div id="view"></div>
        </section>
      </main>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
